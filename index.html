<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penerjemah Suara Super Cepat (ID ke EN)</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 600px;
      text-align: center;
    }
    h1 { color: #333; margin-bottom: 10px; font-size: 22px; }
    p.desc { color: #666; font-size: 14px; margin-bottom: 20px; }
    .box-container { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
    .box { background: #fafafa; border: 1px solid #ddd; border-radius: 8px; padding: 15px; text-align: left; min-height: 70px; }
    .box label { font-weight: bold; font-size: 13px; color: #555; display: block; margin-bottom: 5px; }
    .box p { margin: 0; font-size: 16px; color: #222; word-break: break-word; }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background-color: #0056b3; }
    button.listening {
      background-color: #dc3545;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
    }
    .status { font-size: 14px; color: #777; margin-top: 15px; font-weight: 500; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Penerjemah Suara Cepat (ID ➔ EN)</h1>
    <p class="desc">Bicara dalam Bahasa Indonesia, langsung diterjemahkan dan diucapkan instan.</p>

    <button id="btnStart">Mulai Merekam</button>
    <div id="status" class="status">Status: Siap</div>

    <div class="box-container">
      <div class="box">
        <label>Suara Anda (Bahasa Indonesia):</label>
        <p id="textIndo">...</p>
      </div>
      <div class="box">
        <label>Hasil Terjemahan & Suara (Bahasa Inggris):</label>
        <p id="textEnglish">...</p>
      </div>
    </div>
  </div>

  <script>
    const btnStart = document.getElementById('btnStart');
    const statusText = document.getElementById('status');
    const textIndo = document.getElementById('textIndo');
    const textEnglish = document.getElementById('textEnglish');

    let isRunning = false;
    let recognition;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();

      recognition.lang = 'id-ID';
      recognition.continuous = false; // Set false agar langsung memproses per kalimat pendek secara cepat
      recognition.interimResults = true; // Menampilkan teks secara real-time saat Anda mulai berbicara

      recognition.onstart = () => {
        isRunning = true;
        btnStart.textContent = 'Berhenti';
        btnStart.classList.add('listening');
        statusText.textContent = 'Status: Mendengarkan... (Silakan bicara)';
      };

      recognition.onresult = async (event) => {
        let interimText = '';
        let finalTrans = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTrans += event.results[i][0].transcript;
          } else {
            interimText += event.results[i][0].transcript;
          }
        }

        // Tampilkan teks sementara saat Anda sedang berbicara agar responsif
        if (interimText) {
          textIndo.textContent = interimText;
        }

        // Jika kalimat sudah selesai diucapkan (final)
        if (finalTrans) {
          textIndo.textContent = finalTrans;
          statusText.textContent = 'Status: Menerjemahkan...';

          // Terjemahkan ke Inggris
          const translated = await translateText(finalTrans);
          textEnglish.textContent = translated;

          // Ucapkan secara instan menggunakan fungsi browser
          speakInstantly(translated);
        }
      };

      recognition.onerror = (event) => {
        console.warn("Speech error:", event.error);
      };

      recognition.onend = () => {
        // Jika masih aktif, otomatis nyalakan lagi agar terus siap mendengar
        if (isRunning) {
          try {
            recognition.start();
          } catch (e) {
            console.log(e);
          }
        } else {
          btnStart.textContent = 'Mulai Merekam';
          btnStart.classList.remove('listening');
          statusText.textContent = 'Status: Siap';
        }
      };
    } else {
      alert("Browser Anda tidak mendukung Speech Recognition. Gunakan Google Chrome.");
    }

    btnStart.addEventListener('click', () => {
      if (!isRunning) {
        textIndo.textContent = "...";
        textEnglish.textContent = "...";
        recognition.start();
      } else {
        isRunning = false;
        recognition.stop();
        window.speechSynthesis.cancel();
      }
    });

    // Fungsi Terjemahan Cepat
    async function translateText(text) {
      try {
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=id|en`;
        const response = await fetch(url);
        const data = await response.json();
        return data.responseData.translatedText || text;
      } catch (error) {
        return "[Gagal menerjemahkan]";
      }
    }

    // Fungsi Suara Instan (Tanpa Delay Jaringan)
    function speakInstantly(text) {
      if (!text || text === "...") return;
      statusText.textContent = 'Status: Mengucapkan...';

      window.speechSynthesis.cancel(); // Bersihkan antrean suara sebelumnya

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US'; // Bahasa Inggris (US)
      utterance.rate = 1.0;    // Kecepatan normal

      utterance.onend = () => {
        if (isRunning) {
          statusText.textContent = 'Status: Mendengarkan...';
        }
      };

      window.speechSynthesis.speak(utterance);
    }
  </script>

</body>
</html>
